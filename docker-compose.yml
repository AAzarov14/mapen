services:
  db:
    image: postgres:17-alpine
    container_name: mapen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mapen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mapen"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: mapen-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"          # http://localhost:8080 (system: PostgreSQL, server: db)
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mapen-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # db, not localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mapen
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TTL_DAYS: 30
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy   # start when postgres is up

volumes:
  pgdata: